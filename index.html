/* ─── TIME HELPERS ───────────────────────────────────────────────────────────*/
const toMins = t => { const [h,m]=t.split(":").map(Number); return h*60+m; };
const fromMins = m => { const h=Math.floor(((m%1440)+1440)%1440/60), mn=((m%1440)+1440)%1440%60; return `${String(h).padStart(2,"0")}:${String(mn).padStart(2,"0")}`; };
const addMins = (t,d) => fromMins(toMins(t)+d);
const parseDurMins = dur => {
  let total=0;
  const hm=dur.match(/(\d+)h/); if(hm) total+=parseInt(hm[1])*60;
  const mm=dur.match(/(\d+)m/); if(mm) total+=parseInt(mm[1]);
  return total||60;
};
// Return next N trains at or after afterTime, with arrival time and status
const getNextTrains = (trains, afterTime, durMins, n=3) => {
  if(!trains||!trains.length) return [];
  if(trains[0]==="On-demand — pre-book 48h ahead") return [{time:"On-demand",arrive:"Pre-book 48h",isOnDemand:true,status:"ok"}];
  const validTrains = trains.filter(t => /^\d{2}:\d{2}$/.test(t));
  const after = toMins(afterTime);
  const upcoming = validTrains.filter(t => toMins(t) >= after);
  const result = upcoming.slice(0, n).map((t, i) => {
    const arrMins = toMins(t) + durMins;
    const waitMins = toMins(t) - after;
    const status = i===0 ? "recommended" : i===1 ? "next" : "later";
    return { time:t, arrive:fromMins(arrMins), waitMins, status, isOnDemand:false };
  });
  return result;
};
// Latest train to catch for a departure: must arrive at airport by (flightDep - bufferMins)
const getLatestSafeTrain = (trains, flightDepTime, durMins, bufferMins) => {
  if(!trains||!trains.length) return null;
  const validTrains = trains.filter(t => /^\d{2}:\d{2}$/.test(t));
  const mustArriveBy = toMins(flightDepTime) - bufferMins;
  const safe = validTrains.filter(t => toMins(t) + durMins <= mustArriveBy);
  if(!safe.length) return null;
  const latest = safe[safe.length-1];
  const arrive = toMins(latest) + durMins;
  const bufferLeft = mustArriveBy - arrive;
  return { time:latest, arrive:fromMins(arrive), bufferLeft, isLast:safe.length===1 };
};
// Timing urgency label
const timingLabel = waitMins => {
  if(waitMins<=10) return {label:"Leaves soon",color:"#b91c1c",icon:"🔴"};
  if(waitMins<=30) return {label:"Catch this one",color:"#92600a",icon:"🟡"};
  return {label:"Comfortable",color:"#007a57",icon:"🟢"};
};

/* ─── FLIGHT TIME PANEL ──────────────────────────────────────────────────────*/
function FlightPanel({ port, ap, label, dir, flightNum, setFlightNum, flightTime, setFlightTime, isArrival, tier }) {
  const info = ap.toCity[tier];
  const refFlight = isArrival ? ap.flightIn : ap.flightOut;
  const suggestedFlights = isArrival
    ? [`AC61 (arrives ${ap.code==="NRT"?"15:55":"04:55"})`,"JL72 (arrives 15:30)","Other — enter time manually"]
    : [`AC62 (departs ${ap.code==="NRT"?"17:30":"22:55"})`,"AC36 (departs 22:55)","Other — enter time manually"];

  const durMins = parseDurMins(info.dur);
  const bufferMins = ap.code==="NRT" ? 240 : 150;
  // For arrival: clear immigration 90min after landing, then find next 3 trains
  const clearanceTime = flightTime && isArrival ? fromMins(toMins(flightTime)+90) : null;
  const arrivalTrains = clearanceTime ? getNextTrains(info.trains, clearanceTime, durMins, 3) : [];
  // For departure: find latest safe train + show what time to leave hotel
  const latestSafe = flightTime && !isArrival ? getLatestSafeTrain(info.trains, flightTime, durMins, bufferMins) : null;
  const hotelLeaveBy = latestSafe ? fromMins(toMins(latestSafe.time)-20) : null; // 20min to get to station

  return (
    <div className="card" style={{padding:"clamp(12px,3vw,18px) clamp(12px,3vw,20px)",borderTop:`4px solid #0057FF`}}>
      <div style={{fontSize:11,fontWeight:700,color:"#0057FF",letterSpacing:1,marginBottom:10}}>{label} — {dir}</div>
      <div style={{fontSize:15,fontWeight:800,marginBottom:2}}>{port} — {ap.name}</div>
      <div style={{fontSize:11,color:"var(--gray400)",marginBottom:12}}>{ap.desc} · {ap.flightNote}</div>

      {/* Flight number input */}
      <div style={{marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:600,color:"var(--gray600)",marginBottom:6}}>Flight Number (optional)</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <input type="text" value={flightNum} onChange={e=>setFlightNum(e.target.value.toUpperCase())}
            placeholder={isArrival?(ap.code==="NRT"?"e.g. AC61":"e.g. AC35"):(ap.code==="NRT"?"e.g. AC62":"e.g. AC36")}
            style={{flex:1,padding:"8px 12px",borderRadius:10,border:"2px solid var(--gray200)",fontSize:13,color:"var(--text)",outline:"none"}} />
          {flightNum && (
            <div style={{fontSize:10,padding:"4px 10px",borderRadius:100,background:"var(--sky)",color:"#0057FF",fontWeight:600,whiteSpace:"nowrap"}}>
              {isArrival?"Arriving":"Departing"} {port}
            </div>
          )}
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
          {suggestedFlights.map((f,i)=>(
            <button key={i} onClick={()=>{
              if(!f.includes("manually")) {
                const num=f.split(" ")[0];
                setFlightNum(num);
                const timeMatch=f.match(/(\d{2}:\d{2})/);
                if(timeMatch) setFlightTime(timeMatch[1]);
              }
            }}
            style={{fontSize:10,padding:"4px 10px",borderRadius:100,border:"1.5px solid var(--gray200)",background:"white",cursor:"pointer",color:"var(--gray600)",fontWeight:500}}>
              {f}
            </button>
          ))}
        </div>
      </div>

      {/* Time picker */}
      <div style={{marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:600,color:"var(--gray600)",marginBottom:6}}>
          {isArrival?"Arrival Time at "+port:"Departure Time from "+port}
        </div>
        <input type="time" value={flightTime} onChange={e=>setFlightTime(e.target.value)}
          style={{padding:"8px 12px",borderRadius:10,border:"2px solid var(--gray200)",fontSize:14,color:"var(--text)",background:"white",cursor:"pointer",outline:"none"}} />
        {!flightTime && <span style={{marginLeft:10,fontSize:11,color:"var(--gray400)"}}>Set time for train recommendations</span>}
      </div>

      {/* Smart train recommendation — 3 options for arrival, latest-safe for departure */}
      {flightTime && isArrival && arrivalTrains.length > 0 && (
        <div style={{background:"var(--sky)",borderRadius:12,padding:"12px 14px",marginBottom:10,border:"1.5px solid #0057FF30"}}>
          <div style={{fontSize:12,fontWeight:700,color:"#0057FF",marginBottom:8}}>
            🚂 Transfer Options — clear immigration ~{clearanceTime}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {arrivalTrains.map((tr,i)=>{
              const tl = timingLabel(tr.waitMins);
              const isRec = i===0;
              return(
                <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:10,background:isRec?"white":"rgba(255,255,255,0.5)",border:isRec?"2px solid #0057FF":"1px solid rgba(0,87,255,0.15)",boxShadow:isRec?"0 2px 8px rgba(0,87,255,0.12)":"none"}}>
                  {isRec && <div style={{fontSize:10,fontWeight:800,color:"white",background:"#0057FF",padding:"2px 7px",borderRadius:100,flexShrink:0}}>CATCH</div>}
                  {!isRec && <div style={{fontSize:10,fontWeight:600,color:"var(--gray400)",padding:"2px 7px",borderRadius:100,background:"var(--gray100)",flexShrink:0}}>+{Math.round(toMins(tr.time)-toMins(arrivalTrains[0].time))}m</div>}
                  <div style={{flex:1}}>
                    <div style={{fontSize:14,fontWeight:800,color:isRec?"#0057FF":"var(--gray600)"}}>{tr.time}</div>
                    <div style={{fontSize:10,color:"var(--gray400)"}}>arrives Tokyo ~{tr.arrive}</div>
                  </div>
                  <div style={{fontSize:10,fontWeight:600,color:isRec?"#007a57":"var(--gray400)"}}>{isRec?"✓ Best option":""}</div>
                </div>
              );
            })}
          </div>
          <div style={{marginTop:8,fontSize:11,color:"var(--gray600)"}}>
            🏨 On the <strong style={{color:"#0057FF"}}>{arrivalTrains[0]?.time}</strong> train → arrive central Tokyo <strong>{arrivalTrains[0]?.arrive}</strong>
          </div>
        </div>
      )}
      {flightTime && !isArrival && (
        <div style={{background:"#fff8f8",borderRadius:12,padding:"12px 14px",marginBottom:10,border:"1.5px solid #b91c1c30"}}>
          <div style={{fontSize:12,fontWeight:700,color:"#b91c1c",marginBottom:8}}>⏰ Your Departure Timeline</div>
          {latestSafe ? (
            <>
              <div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:10,background:"white",border:"2px solid #b91c1c",marginBottom:6,boxShadow:"0 2px 8px rgba(185,28,28,0.1)"}}>
                <div style={{fontSize:10,fontWeight:800,color:"white",background:"#b91c1c",padding:"2px 7px",borderRadius:100,flexShrink:0}}>LATEST</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:14,fontWeight:800,color:"#b91c1c"}}>{latestSafe.time}</div>
                  <div style={{fontSize:10,color:"var(--gray400)"}}>arrives {ap.code} ~{latestSafe.arrive}</div>
                </div>
                <div style={{fontSize:10,color:"#007a57",fontWeight:600}}>{latestSafe.bufferLeft>=60?`+${Math.round(latestSafe.bufferLeft/60)}h buffer`:latestSafe.bufferLeft>0?`+${latestSafe.bufferLeft}m buffer`:"⚠ Tight"}</div>
              </div>
              <div style={{fontSize:11,color:"var(--gray600)",lineHeight:1.8}}>
                <div>🏨 Leave hotel by <strong style={{color:"#b91c1c"}}>{hotelLeaveBy}</strong> (20min to station)</div>
                <div>🚂 Catch <strong>{info.mode.split("—")[0].trim()}</strong> at <strong style={{color:"#b91c1c"}}>{latestSafe.time}</strong></div>
                <div>✈️ Arrive {ap.code} ~{latestSafe.arrive} · Flight at <strong>{flightTime}</strong></div>
              </div>
            </>
          ) : (
            <div style={{fontSize:11,color:"#b91c1c",fontWeight:600}}>⚠ No safe train found — consider private car or earlier flight</div>
          )}
          <div style={{marginTop:8,fontSize:10,color:"var(--gray400)",fontStyle:"italic"}}>{ap.code==="NRT"?"Narita: allow 3h at airport (immigration + check-in + security)":"Haneda: allow 2.5h at international terminal"}</div>
        </div>
      )}

      {/* Transfer cost */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:10,borderTop:"1px solid var(--gray100)"}}>
        <div>
          <div style={{fontSize:12,color:"var(--gray600)"}}>🚌 {info.mode}</div>
          <div style={{fontSize:11,color:"var(--gray400)"}}>⏱ {info.dur} journey</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:20,fontWeight:900,color:"#0057FF"}}>${info.cost*2}</div>
          <div style={{fontSize:10,color:"var(--gray400)"}}>2 pax</div>
        </div>
      </div>
    </div>
  );
}

/* ─── LEAFLET MAP ────────────────────────────────────────────────────────────*/
function LeafletMap({city}) {
  const mapData = CITY_MAPS[city];
  const SC = {hotel:"#0057FF",temple:"#92600a",attraction:"#9333ea",nature:"#007a57",train:"#b91c1c"};
  const SE = {hotel:"🏨",temple:"⛩️",attraction:"🎭",nature:"🌿",train:"🚉"};
  const html = useMemo(()=>{
    if(!mapData) return "";
    const markers = mapData.spots.map(s=>{
      const c=SC[s.type]||"#333", e=SE[s.type]||"📍";
      return `L.marker([${s.lat},${s.lng}],{icon:L.divIcon({className:'',html:'<div style="background:white;border:2.5px solid ${c};border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 12px ${c}55">${e}</div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(map).bindPopup('<div style="font-family:DM Sans,sans-serif;padding:2px"><b style="font-size:13px">${s.name}</b><br><span style="font-size:10px;color:${c};text-transform:capitalize">${s.type}</span></div>');`;
    }).join("");
    return `<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"><\/script><style>*{margin:0;padding:0}html,body,#m{width:100%;height:100%}.leaflet-popup-content-wrapper{background:#fff;border:none;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.12)}.leaflet-popup-tip{background:#fff}.leaflet-control-zoom a{background:#fff!important;color:#0057FF!important;border-color:#e8f0ff!important;border-radius:8px!important;margin-bottom:4px}.leaflet-control-zoom{border:none!important;box-shadow:0 4px 16px rgba(0,0,0,.1)!important}.leaflet-control-attribution{background:rgba(255,255,255,.8)!important;font-size:8px!important;border-radius:8px!important}</style>  <style>
    *{ box-sizing:border-box; }
    body{ overflow-x:hidden !important; background:#f8faff; }
    #root{ min-height:100vh; }
    /* Stack all 2-col grids on narrow screens */
    @media(max-width:560px){
      [style*="gridTemplateColumns"]{
        grid-template-columns: 1fr !important;
      }
      [style*="minmax(260px"]{
        grid-template-columns: 1fr !important;
      }
      [style*="minmax(280px"]{
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head><body><div id="m"></div><script>var map=L.map('m',{center:[${mapData.lat},${mapData.lng}],zoom:${mapData.zoom},zoomControl:true});L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CartoDB'}).addTo(map);${markers}<\/script></body></html>`;
  },[city]);
  return <iframe srcDoc={html} style={{width:"100%",height:"100%",border:"none",borderRadius:"inherit"}} title="map" sandbox="allow-scripts"/>;
}

/* ─── EDIT ROW ───────────────────────────────────────────────────────────────*/
function EditRow({label,value,onSave,accent}) {
  const [editing,setEditing] = useState(false);
  const [draft,setDraft] = useState(value);
  useEffect(()=>{setDraft(value);},[value]);
  const commit = v => { onSave(Math.max(0,Number(v))); setEditing(false); };
  return (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid var(--gray100)"}}>
      <span style={{fontSize:13,color:"var(--gray600)",fontWeight:500}}>{label}</span>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        {editing
          ? <input type="number" value={draft} autoFocus onChange={e=>setDraft(e.target.value)} onBlur={()=>commit(draft)} onKeyDown={e=>{if(e.key==="Enter")commit(draft);if(e.key==="Escape")setEditing(false);}}
              style={{width:72,border:`2px solid ${accent}`,borderRadius:8,padding:"4px 8px",color:"var(--text)",fontSize:14,textAlign:"right",outline:"none"}}/>
          : <span style={{fontSize:15,fontWeight:700,color:value===0?"#007a57":accent,minWidth:52,textAlign:"right"}}>{value===0?"Free":`$${value}`}</span>}
        <button onClick={()=>setEditing(x=>!x)} style={{width:28,height:28,borderRadius:8,border:`1px solid ${editing?accent:"var(--gray200)"}`,cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.2s",background:editing?accent:"white",color:editing?"white":"var(--gray400)"}}>
          {editing?"✓":"✏️"}
        </button>
      </div>
    </div>
  );
}

                                  <span style={{fontSize:14,fontWeight:900,color:"#b91c1c",minWidth:44}}>{ls.time}</span>
                                  <span style={{fontSize:11,color:"var(--gray400)"}}>→ arrives {exitPort} <strong>{ls.arrive}</strong></span>
                                  <span style={{marginLeft:"auto",fontSize:10,fontWeight:700,color:ls.bufferLeft>=60?"#007a57":ls.bufferLeft>0?"#92600a":"#b91c1c"}}>
                                    {ls.bufferLeft>=60?`+${Math.round(ls.bufferLeft/60)}h spare`:ls.bufferLeft>0?`+${ls.bufferLeft}m spare`:"⚠ Very tight"}
                                  </span>
                                </div>
                                <div style={{fontSize:11,color:"var(--gray600)",padding:"6px 0"}}>
                                  🏨 Leave your hotel by <strong style={{color:"#b91c1c"}}>{leaveHotel}</strong> to reach the station in time
                                </div>
                              </div>
                            ) : (
                              <div style={{padding:"8px 12px",background:"#fff2f2",borderRadius:10,fontSize:11,color:"#b91c1c",fontWeight:600}}>
                                ⚠ No safe train found for this flight time — consider private transfer or earlier flight
                              </div>
                            )}
                          </div>
                        );
                      })() : (
                        <div>
                          <div style={{fontSize:10,fontWeight:700,color:"var(--gray400)",marginBottom:6,letterSpacing:1}}>
                            SAMPLE DEPARTURES — set flight time above for personalised trains ↑
                          </div>
                          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                            {info.trains.filter(t=>/^\d{2}:\d{2}$/.test(t)).slice(0,6).map((t,i)=>(
                              <span key={i} style={{fontSize:11,padding:"3px 10px",borderRadius:100,background:"var(--sky)",color:"#0057FF",fontWeight:600}}>{t}</span>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:10,borderTop:"1px solid var(--gray100)"}}>
                      <span style={{fontSize:12,color:"var(--gray400)"}}>Transfer (2 pax)</span>
                      <span style={{fontSize:20,fontWeight:900,color:"#0057FF"}}>${info.cost*2}</span>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* JR Pass */}
            <div style={{background:tier==="budget"?"#fff8e6":"#e8f0ff",border:`1.5px solid ${tier==="budget"?"#92600a40":"#0057FF30"}`,borderRadius:14,padding:"clamp(10px,3vw,16px) clamp(12px,3vw,20px)",marginBottom:24}}>
              <div style={{fontWeight:700,color:tier==="budget"?"#92600a":"#0057FF",marginBottom:6,fontSize:14}}>
                {tier==="budget"?"⚠️ No JR Pass — paying per train":"✅ 14-day JR Pass covers all Shinkansen"}
              </div>
              <div style={{fontSize:13,color:"var(--gray600)",lineHeight:1.6}}>
                {tier==="budget"?"At budget tier you pay per ride. JR Pass costs $860 for 2 adults — worth it with 3+ Shinkansen.":"JR Pass $860 for 2 adults, 14-day. Buy before leaving Canada — not sold inside Japan. Covers all bullet trains and NEX to Narita."}
              </div>
            </div>

            {/* Outbound */}
            <div className="section-label">🚄 Outbound Journey</div>
            <div style={{background:"white",borderRadius:16,padding:"clamp(10px,3vw,16px) clamp(12px,3vw,20px)",marginBottom:12,boxShadow:"var(--shadow)",border:"1px solid var(--gray100)"}}>
              <div style={{fontSize:11,color:"var(--gray400)",marginBottom:12,fontWeight:600}}>YYZ ──✈──▶ {entryPort} → {active.join(" → ")}</div>
              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                {active.map((city,i)=>{
                  const cc=CC[city],next=active[i+1],tr=next?getTr(city,next):null;
                  return[
                    <div key={city} style={{textAlign:"center",flexShrink:0}}>
                      <div style={{width:40,height:40,borderRadius:12,background:`${cc}18`,border:`2px solid ${cc}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,margin:"0 auto 4px"}}>{CE[city]}</div>
                      <div style={{fontSize:10,fontWeight:700,color:cc}}>{city}</div>
                      <div style={{fontSize:9,color:"var(--gray400)"}}>{cityNights[city]}n</div>
                    </div>,
                    tr&&<div key={`t${i}`} style={{flex:1,minWidth:40,textAlign:"center"}}>
                      <div style={{height:3,background:`${tr.color}40`,borderRadius:2,margin:"0 4px 4px"}}/>
                      <div style={{fontSize:9,color:tr.color,fontWeight:600}}>{tr.dur}</div>
                    </div>
                  ];
                })}
              </div>
            </div>

            {active.map((city,i)=>{
              if(i===0) return null;
              const prev=active[i-1],tr=getTr(prev,city);
              if(!tr) return null;
              const pp=tr.perPerson[tier];
              return(
                <div key={city} className="card" style={{padding:"clamp(10px,3vw,16px) clamp(12px,3vw,20px)",marginBottom:10,borderLeft:`4px solid ${tr.color}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                        <div style={{fontSize:13,fontWeight:700,color:CC[prev]}}>{CE[prev]} {prev}</div>
                        <div style={{flex:1,height:2,background:`${tr.color}30`,borderRadius:1}}/>
                        <div style={{fontSize:11,color:tr.color,fontWeight:600}}>→</div>
                        <div style={{flex:1,height:2,background:`${tr.color}30`,borderRadius:1}}/>
                        <div style={{fontSize:13,fontWeight:700,color:CC[city]}}>{CE[city]} {city}</div>
                      </div>
                      <div style={{fontSize:13,fontWeight:600,color:tr.color,marginBottom:3}}>🚄 {tr.line}</div>
                      <div style={{fontSize:12,color:"var(--gray600)",marginBottom:8}}>⏱ {tr.dur} · {tr.note[tier]}</div>
                      {/* Train timetable — recommended 3 from 08:00 (post-breakfast) */}
                      <div>
                        <div style={{fontSize:10,fontWeight:700,color:"var(--gray400)",marginBottom:6,letterSpacing:1}}>RECOMMENDED TRAINS (MORNING DEPARTURES)</div>
                        {(() => {
                          const durM = parseDurMins(tr.dur);
                          const opts = getNextTrains(tr.trains||[], "08:00", durM, 3);
                          if(!opts.length) return <span style={{fontSize:11,color:"var(--gray400)"}}>Check timetable locally</span>;
                          return (
                            <div style={{display:"flex",flexDirection:"column",gap:4}}>
                              {opts.map((opt,i)=>(
                                <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",borderRadius:10,background:i===0?`${tr.color}15`:"var(--gray50)",border:i===0?`2px solid ${tr.color}`:"1px solid var(--gray100)"}}>
                                  {i===0 && <span style={{fontSize:9,fontWeight:800,color:"white",background:tr.color,padding:"2px 7px",borderRadius:100,flexShrink:0}}>BEST</span>}
                                  {i>0  && <span style={{fontSize:9,color:"var(--gray400)",padding:"2px 7px",borderRadius:100,background:"var(--gray100)",flexShrink:0}}>+{toMins(opt.time)-toMins(opts[0].time)}m</span>}
                                  <span style={{fontSize:14,fontWeight:900,color:i===0?tr.color:"var(--gray600)",minWidth:44}}>{opt.time}</span>
                                  <span style={{fontSize:11,color:"var(--gray400)"}}>→ arrives <strong>{opt.arrive}</strong></span>
                                </div>
                              ))}
                            </div>
                          );
                        })()}
                      </div>
                    </div>
                    <div style={{textAlign:"right",flexShrink:0,marginLeft:12}}>
                      <div style={{fontSize:22,fontWeight:900,color:pp===0?"#007a57":tr.color}}>{pp===0?"Covered":"$"+(pp*2)}</div>
                      {pp>0?<div style={{fontSize:10,color:"var(--gray400)"}}>${pp}/person · 2 pax</div>
                           :<div style={{fontSize:10,color:"#007a57",fontWeight:600}}>by JR Pass</div>}
                    </div>
                  </div>
                </div>
              );
            })}

            {/* Return journey */}
            {needsReturn&&RETURN_TRAINS[lastCity]&&(()=>{
              const retTr=RETURN_TRAINS[lastCity],exitInfo=exitAp.toCity[tier],pp=retTr.perPerson[tier];
              return(
                <div style={{marginTop:8}}>
                  <div className="section-label" style={{marginTop:24}}>🏠 Return — {lastCity} → {exitPort} → YYZ</div>
                  <div className="card" style={{padding:"clamp(10px,3vw,16px) clamp(12px,3vw,20px)",marginBottom:10,borderLeft:`4px solid ${retTr.color}`}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
                      <div style={{flex:1}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                          <div style={{fontSize:13,fontWeight:700,color:CC[lastCity]}}>{CE[lastCity]} {lastCity}</div>
                          <div style={{flex:1,height:2,background:`${retTr.color}30`,borderRadius:1}}/>
                          <div style={{fontSize:11,color:retTr.color}}>→</div>
                          <div style={{flex:1,height:2,background:`${retTr.color}30`,borderRadius:1}}/>
                          <div style={{fontSize:13,fontWeight:700,color:"#0057FF"}}>🗼 Tokyo</div>
                        </div>
                        <div style={{fontSize:13,fontWeight:600,color:retTr.color,marginBottom:3}}>🚄 {retTr.line}</div>
                        <div style={{fontSize:12,color:"var(--gray600)",marginBottom:8}}>⏱ {retTr.dur} · {retTr.note[tier]}</div>
                        <div style={{background:"var(--sky)",borderRadius:10,padding:"10px 14px",marginBottom:8}}>
                          <div style={{fontSize:11,fontWeight:700,color:"#0057FF",marginBottom:4}}>📋 Step-by-step to {exitPort}</div>
                          <div style={{fontSize:12,color:"var(--gray600)",lineHeight:1.6}}>{retTr.tips[exitPort]}</div>
                        </div>
                        {/* Smart return trains: if departure flight set, compute latest safe; else show 3 from 06:00 */}
                        {departureTime ? (() => {
                          const bufMins = exitPort==="NRT"?240:150;
                          const exitDurMins = parseDurMins(exitAp.toCity[tier].dur);
                          // total time needed from lastCity: train dur + airport transfer + airport buffer
                          const totalMins = parseDurMins(retTr.dur) + exitDurMins + (exitPort==="NRT"?180:150);
                          const mustLeaveBy = fromMins(toMins(departureTime)-totalMins);
                          const ls = getLatestSafeTrain(retTr.trains||[], mustLeaveBy, 0, 0); // leave by mustLeaveBy
                          // find trains before mustLeaveBy
                          const validT = (retTr.trains||[]).filter(t=>/^\d{2}:\d{2}$/.test(t));
                          const safeTrs = validT.filter(t=>toMins(t)<=toMins(mustLeaveBy));
                          const latestSafeReturn = safeTrs.length ? safeTrs[safeTrs.length-1] : null;
                          const latestArr = latestSafeReturn ? fromMins(toMins(latestSafeReturn)+parseDurMins(retTr.dur)) : null;
                          return (
                            <div style={{marginTop:8}}>
                              <div style={{fontSize:10,fontWeight:700,color:"var(--gray400)",marginBottom:6,letterSpacing:1}}>
                                TRAINS TO CATCH FOR {departureTime} FLIGHT
                              </div>
                              {latestSafeReturn ? (
                                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                                  {[...safeTrs].reverse().slice(0,3).reverse().map((t,i,arr)=>{
                                    const isLatest = t===latestSafeReturn;
                                    const arrT = fromMins(toMins(t)+parseDurMins(retTr.dur));
                                    return(
                                      <div key={t} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",borderRadius:10,background:isLatest?"#fff2f2":"var(--gray50)",border:isLatest?"2px solid #b91c1c":"1px solid var(--gray100)"}}>
                                        {isLatest && <span style={{fontSize:9,fontWeight:800,color:"white",background:"#b91c1c",padding:"2px 7px",borderRadius:100,flexShrink:0}}>LATEST</span>}
                                        {!isLatest && <span style={{fontSize:9,color:"var(--gray400)",padding:"2px 7px",borderRadius:100,background:"var(--gray100)",flexShrink:0}}>earlier</span>}
                                        <span style={{fontSize:14,fontWeight:900,color:isLatest?"#b91c1c":"var(--gray600)",minWidth:44}}>{t}</span>
                                        <span style={{fontSize:11,color:"var(--gray400)"}}>→ Tokyo <strong>{arrT}</strong></span>
                                        {isLatest&&<span style={{marginLeft:"auto",fontSize:10,color:"#007a57",fontWeight:600}}>✓ makes flight</span>}
                                      </div>
                                    );
                                  })}
                                  <div style={{fontSize:11,color:"var(--gray600)",padding:"6px 2px"}}>
                                    🏨 Leave {lastCity} no later than <strong style={{color:"#b91c1c"}}>{mustLeaveBy}</strong>
                                  </div>
                                </div>
                              ) : (
                                <div style={{padding:"8px 12px",background:"#fff2f2",borderRadius:10,fontSize:11,color:"#b91c1c",fontWeight:600}}>
                                  ⚠ No train catches your {departureTime} flight — consider flying out of a closer city or earlier flight
                                </div>
                              )}
                            </div>
                          );
                        })() : (
                          <div style={{marginTop:8}}>
                            <div style={{fontSize:10,fontWeight:700,color:"var(--gray400)",marginBottom:6,letterSpacing:1}}>MORNING OPTIONS — set departure flight time for personalised trains</div>
                            <div style={{display:"flex",flexDirection:"column",gap:4}}>
                              {getNextTrains(retTr.trains||[],"07:00",parseDurMins(retTr.dur),3).map((opt,i)=>(
                                <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",borderRadius:10,background:i===0?`${retTr.color}12`:"var(--gray50)",border:i===0?`2px solid ${retTr.color}`:"1px solid var(--gray100)"}}>
                                  {i===0&&<span style={{fontSize:9,fontWeight:800,color:"white",background:retTr.color,padding:"2px 7px",borderRadius:100}}>FIRST</span>}
                                  {i>0&&<span style={{fontSize:9,color:"var(--gray400)",padding:"2px 7px",borderRadius:100,background:"var(--gray100)"}}>+{toMins(opt.time)-toMins(getNextTrains(retTr.trains||[],"07:00",parseDurMins(retTr.dur),3)[0].time)}m</span>}
                                  <span style={{fontSize:14,fontWeight:900,color:i===0?retTr.color:"var(--gray600)",minWidth:44}}>{opt.time}</span>
                                  <span style={{fontSize:11,color:"var(--gray400)"}}>→ Tokyo ~{opt.arrive}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                      <div style={{textAlign:"right",flexShrink:0,marginLeft:12}}>
                        <div style={{fontSize:22,fontWeight:900,color:pp===0?"#007a57":retTr.color}}>{pp===0?"Covered":"$"+(pp*2)}</div>
                        {pp>0?<div style={{fontSize:10,color:"var(--gray400)"}}>${pp}/person</div>:<div style={{fontSize:10,color:"#007a57",fontWeight:600}}>by JR Pass</div>}
                      </div>
                    </div>
                  </div>
                  <div className="card" style={{padding:"clamp(10px,3vw,16px) clamp(12px,3vw,20px)",marginBottom:10,borderLeft:"4px solid #0057FF"}}>
                    <div style={{fontSize:13,fontWeight:700,color:"#0057FF",marginBottom:6}}>🚌 Tokyo City → {exitPort} — {exitInfo.mode}</div>
                    <div style={{fontSize:12,color:"var(--gray600)",marginBottom:10}}>⏱ {exitInfo.dur} · then check in for YYZ flight</div>
                    <div style={{background:"#fff2f2",borderRadius:10,padding:"10px 14px",border:"1px solid #b91c1c30"}}>
                      <div style={{fontSize:11,fontWeight:700,color:"#b91c1c",marginBottom:4}}>⏰ Allow enough time!</div>
                      <div style={{fontSize:12,color:"var(--gray600)",lineHeight:1.6}}>{exitPort==="NRT"?"Narita is 60km out — arrive 3h before departure. Leave Tokyo 4–5h before flight.":"Haneda is close — arrive 2.5h before. Leave Tokyo 2–3h before flight."}</div>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:12}}>
                      <span style={{fontSize:12,color:"var(--gray400)"}}>Airport transfer (2 pax)</span>
                      <span style={{fontSize:22,fontWeight:900,color:"#0057FF"}}>${exitInfo.cost*2}</span>
                    </div>
                  </div>
                  <div style={{background:"linear-gradient(135deg,#0057FF18,#0057FF08)",border:"1.5px solid #0057FF30",borderRadius:14,padding:"clamp(10px,3vw,16px) clamp(12px,3vw,20px)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontSize:13,fontWeight:600,color:"var(--gray600)"}}>Total return journey · 2 adults</div>
                      <div style={{fontSize:11,color:"var(--gray400)",marginTop:2}}>{lastCity} → Tokyo → {exitPort}</div>
                      {pp===0&&<div style={{fontSize:11,color:"#007a57",fontWeight:600,marginTop:2}}>Train covered by JR Pass</div>}
                    </div>
                    <div style={{fontSize:26,fontWeight:900,color:"#0057FF"}}>${(pp*2+exitInfo.cost*2).toLocaleString()}</div>
                  </div>
                </div>
              );
            })()}

            {/* Transport summary */}
            <div className="card" style={{padding:"clamp(12px,3vw,18px) clamp(12px,3vw,20px)",marginTop:20}}>
              <div className="section-label">📊 Full Transport Summary · 2 Adults</div>
              {[
                {label:`🛬 ${entryPort} arrival transfer`,val:entryAp.toCity[tier].cost*2,color:"#0057FF"},
                {label:`🛫 ${exitPort} departure transfer`,val:exitAp.toCity[tier].cost*2,color:"#0057FF"},
                {label:tier==="budget"?"Individual Shinkansen tickets":"14-day JR Pass × 2",
                 val:tier==="budget"?schedule.reduce((s,d)=>s+(d.transition?d.transition.perPerson[tier]*2:0),0)+(needsReturn&&RETURN_TRAINS[lastCity]?RETURN_TRAINS[lastCity].perPerson[tier]*2:0):active.length>1?860:0,
                 color:tier==="budget"?"#92600a":"#007a57"},
                {label:"IC card / local metro (all days)",val:tier==="luxury"?0:Math.round(schedule.length*8),color:"var(--gray400)"},
                ...(tier==="premium"?[{label:"Taxis & upgrades",val:160,color:"var(--gray400)"}]:[]),
                ...(tier==="luxury"?[{label:"Private transfers (all)",val:800,color:"#9333ea"}]:[]),
              ].map((item,i,arr)=>(
                <div key={item.label} style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:13,padding:"10px 0",borderBottom:i<arr.length-1?"1px solid var(--gray100)":"none",color:"var(--gray600)"}}>
                  <span style={{fontWeight:500}}>{item.label}</span>
                  <span style={{fontWeight:700,color:item.color||"var(--text)"}}>${item.val.toLocaleString()}</span>
                </div>
              ))}
            </div>
          </div>
        )}

      </div>
      <div style={{textAlign:"center",padding:"20px 24px",borderTop:"1px solid var(--gray100)",color:"var(--gray400)",fontSize:11}}>
        All costs USD · 2 adults · excl. flights · ~¥150/USD · October 2025 · Map © OpenStreetMap & CartoDB
      </div>
    </>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
